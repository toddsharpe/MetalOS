name: CI

# Build on pull requests to master and on merges (pushes) to master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    # Puts cl.exe, link.exe and ml64.exe (x64) on the path
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build boot
      shell: cmd
      run: scripts\build_boot.bat

    - name: Build kernel
      shell: cmd
      run: scripts\build_kernel.bat

    - name: Build user
      shell: cmd
      run: scripts\build_user.bat

    # diskpart needs admin, which hosted runners have. DOOM.WAD/DEFAULT.CFG aren't
    # available here, so the image has doom.exe but no game data.
    - name: Build VHDX
      shell: cmd
      run: scripts\build_vhd.cmd

    - name: Upload VHDX
      uses: actions/upload-artifact@v7
      with:
        name: MetalOS-vhdx
        path: build/MetalOS.vhdx
        if-no-files-found: error
