name: CI

# Build on pull requests to master and on merges (pushes) to master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    # Puts msbuild, cl.exe, link.exe and ml64.exe (x64) on the path
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # Full rebuilds of MetalOS.sln (boot loader, kernel, user mode and the host tests); Release last, so the disk below is Release
    - name: Build Debug
      shell: cmd
      run: scripts\build.bat Debug

    - name: Build Release
      shell: cmd
      run: scripts\build.bat Release

    # diskpart needs admin, which hosted runners have. DOOM.WAD/DEFAULT.CFG aren't
    # available here, so the image has doom.exe but no game data.
    - name: Build VHDX
      shell: cmd
      run: scripts\build_vhd.cmd

    - name: Upload VHDX
      uses: actions/upload-artifact@v7
      with:
        name: MetalOS-vhdx
        path: build/MetalOS.vhdx
        if-no-files-found: error
